name: Deploy Forge app

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and Forge environment to deploy to.
        type: string
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: flagsmith-jira-app
    env:
      FORGE_EMAIL: ${{ vars.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: flagsmith-jira-app/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install Forge CLI
        run: npm install -g @forge/cli@12

      - name: Opt out of Forge usage analytics
        run: forge settings set usage-analytics false

      - name: Install app dependencies
        run: npm ci

      # Manifest variables: substituted into manifest.yml by the Forge CLI from
      # the shell at deploy time. Only override the SaaS defaults when provided.
      - name: Set manifest variables
        run: |
          if [ -n "${{ vars.FORGE_APP_ID }}" ] && [ "${{ vars.FORGE_APP_ID }}" != "" ]; then
            echo "FORGE_APP_ID=${{ vars.FORGE_APP_ID }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ vars.FLAGSMITH_BACKEND_HOST }}" ] && [ "${{ vars.FLAGSMITH_BACKEND_HOST }}" != "" ]; then
            echo "FLAGSMITH_BACKEND_HOST=${{ vars.FLAGSMITH_BACKEND_HOST }}" >> "$GITHUB_ENV"
          fi
      # Runtime variables: stored by Forge and read via process.env in functions.
      # Only set them when provided; otherwise the code falls back to SaaS defaults.
      - name: Set runtime variables
        run: |
          if [ -n "${{ vars.FLAGSMITH_API_V1 }}" ] && [ "${{ vars.FLAGSMITH_API_V1 }}" != "" ]; then
            forge variables set FLAGSMITH_API_V1 "${{ vars.FLAGSMITH_API_V1 }}" --environment ${{ inputs.environment }}
          fi
          if [ -n "${{ vars.FLAGSMITH_APP }}" ] && [ "${{ vars.FLAGSMITH_APP }}" != "" ]; then
            forge variables set FLAGSMITH_APP "${{ vars.FLAGSMITH_APP }}" --environment ${{ inputs.environment }}
          fi

      - name: Deploy
        run: forge deploy --environment ${{ inputs.environment }} --non-interactive
