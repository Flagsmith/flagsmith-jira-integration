name: Deploy Forge app

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and Forge environment to deploy to.
        type: string
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: flagsmith-jira-app
    env:
      FORGE_EMAIL: ${{ vars.JIRA_FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.JIRA_FORGE_API_TOKEN }}
      # substituted into manifest.yml by the Forge CLI from the shell at deploy time
      # test.
      FORGE_APP_ID: ${{ vars.JIRA_FORGE_APP_ID }}
      FLAGSMITH_BACKEND_HOST: ${{ vars.JIRA_FLAGSMITH_BACKEND_HOST }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: flagsmith-jira-app/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install Forge CLI
        run: npm install -g @forge/cli@12

      - name: Opt out of Forge usage analytics
        run: forge settings set usage-analytics false

      - name: Install app dependencies
        run: npm ci

      # Runtime variables: stored by Forge and read via process.env in functions.
      - name: Set runtime variables
        env:
          FLAGSMITH_API_V1: ${{ vars.JIRA_FLAGSMITH_API_V1 }}
          FLAGSMITH_APP: ${{ vars.JIRA_FLAGSMITH_APP }}
        run: |
          forge variables set FLAGSMITH_API_V1 "$FLAGSMITH_API_V1" --environment ${{ inputs.environment }}
          forge variables set FLAGSMITH_APP "$FLAGSMITH_APP" --environment ${{ inputs.environment }}

      - name: Deploy
        run: forge deploy --environment ${{ inputs.environment }} --non-interactive
