app:
  id: ari:cloud:ecosystem::app/${FORGE_APP_ID}
  runtime:
    name: nodejs22.x
modules:
  # TODO later: consider adding a useAsGetStarted adminPage
  jira:adminPage:
    - key: app-settings
      title: Configure Flagsmith for Jira
      icon: resource:static;logo.svg
      render: native
      resource: app-settings
      resolver:
        function: resolver
      useAsConfig: true
  jira:projectSettingsPage:
    - key: project-settings
      title: Connect Flagsmith project
      icon: resource:static;logo.svg
      render: native
      resource: project-settings
      resolver:
        function: resolver
  jira:issuePanel:
    - key: issue-features
      title: Linked feature flags
      icon: resource:static;logo.svg
      render: native
      resource: issue-features
      resolver:
        function: resolver
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: static
    path: static
  - key: app-settings
    path: src/frontend/app-settings.tsx
  - key: project-settings
    path: src/frontend/project-settings.tsx
  - key: issue-features
    path: src/frontend/issue-features.tsx
permissions:
  scopes:
    - storage:app
    - read:permission:jira
    - read:project.property:jira
    - write:project.property:jira
    - delete:project.property:jira
    - read:issue.property:jira
    - write:issue.property:jira
    - delete:issue.property:jira
  external:
    fetch:
      backend:
        - ${FLAGSMITH_BACKEND_HOST}
environment:
  variables:
    - key: FORGE_APP_ID
    - key: FLAGSMITH_BACKEND_HOST
